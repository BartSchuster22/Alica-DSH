name: D6 independent acceptance

on:
  push:
    branches: [main]
    paths:
      - release/d6-candidate/**
      - release/d6-independent-acceptance.json
      - scripts/d6-*
      - scripts/build-d6-*
      - docs/**
      - licenses/**
      - SECURITY.md
      - SUPPORT.md
      - THIRD-PARTY-NOTICES.md
      - .github/workflows/d6-independent-acceptance.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

env:
  BUNDLE: alica-community-dsh-1.0.0-linux-amd64.bundle.tar.zst

jobs:
  sign-images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
        with: { cosign-release: v2.5.3 }
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Mirror exact images into D6-controlled publication namespace
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          python3 - <<'PY' > "$RUNNER_TEMP/images.tsv"
          import json
          for x in json.load(open('release/d6-candidate/publication-source-map.json'))['images']: print(x['source'],x['destination'],x['digest'],sep='\t')
          PY
          while IFS=$'\t' read -r source destination digest; do
            repo=${destination%@*}; tag="d6-${digest#sha256:}"; tag=${tag:0:67}
            skopeo copy --all --preserve-digests "docker://$source" "docker://$repo:$tag"
            test "$(skopeo inspect --format '{{.Digest}}' "docker://$repo:$tag")" = "$digest"
          done < "$RUNNER_TEMP/images.tsv"
      - name: Keyless-sign every immutable runtime image
        run: |
          python3 -c 'import json; print("\n".join(x["destination"] for x in json.load(open("release/d6-candidate/publication-source-map.json"))["images"]))' > "$RUNNER_TEMP/images"
          while IFS= read -r image; do
            if ! output=$(cosign sign --yes "$image" 2>&1); then
              output=${output//$'\n'/' %0A '}; echo "::error title=Cosign sign failed::$image %0A $output"; exit 1
            fi
          done < "$RUNNER_TEMP/images"
          while IFS= read -r image; do cosign verify --certificate-identity-regexp '^https://github.com/BartSchuster22/Alica-DSH/' --certificate-oidc-issuer https://token.actions.githubusercontent.com "$image" >/dev/null; done < "$RUNNER_TEMP/images"

  bundle:
    needs: sign-images
    runs-on: ubuntu-24.04
    outputs:
      asset_url: ${{ steps.asset.outputs.url }}
      asset_sha256: ${{ steps.asset.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
        with: { cosign-release: v2.5.3 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd
      - name: Build complete offline bundle
        run: chmod +x scripts/build-d6-offline-bundle.sh && scripts/build-d6-offline-bundle.sh "$RUNNER_TEMP/dist"
      - id: asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(cut -d' ' -f1 "$RUNNER_TEMP/dist/$BUNDLE.sha256")
          gh release view d6-independent-candidate >/dev/null 2>&1 || gh release create d6-independent-candidate --prerelease --target "$GITHUB_SHA" --title 'ALICA Community DSH 1.0.0 independent-acceptance candidate' --notes 'Candidate publication pending two-host D6 independent acceptance.'
          gh release upload d6-independent-candidate "$RUNNER_TEMP/dist/$BUNDLE" "$RUNNER_TEMP/dist/$BUNDLE.sha256" --clobber
          echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/download/d6-independent-candidate/$BUNDLE" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: d6-bundle-metadata
          path: ${{ runner.temp }}/dist/*.sha256

  operator-online:
    needs: bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
        with: { cosign-release: v2.5.3 }
      - name: Verify signed online image inventory
        run: |
          python3 -c 'import json; m=json.load(open("release/d6-candidate/manifest.json")); print("\n".join(sorted({c["artifact"][6:] for c in m["components"] if c["artifact"].startswith("oci://ghcr.io/")})))' > "$RUNNER_TEMP/images"
          while IFS= read -r image; do cosign verify --certificate-identity-regexp '^https://github.com/BartSchuster22/Alica-DSH/' --certificate-oidc-issuer https://token.actions.githubusercontent.com "$image" >/dev/null; done < "$RUNNER_TEMP/images"
      - name: Independent public online operator
        env: { D6_MODE: online }
        run: chmod +x scripts/d6-*.sh && scripts/d6-independent-operator-acceptance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d6-online-evidence
          path: acceptance-evidence-d6-online/

  operator-offline:
    needs: bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Obtain and verify published offline bundle
        env:
          URL: ${{ needs.bundle.outputs.asset_url }}
          EXPECTED: ${{ needs.bundle.outputs.asset_sha256 }}
        run: |
          curl -fL "$URL" -o "$RUNNER_TEMP/$BUNDLE"
          test "$(sha256sum "$RUNNER_TEMP/$BUNDLE"|cut -d' ' -f1)" = "$EXPECTED"
          mkdir "$RUNNER_TEMP/offline" && tar --zstd -xf "$RUNNER_TEMP/$BUNDLE" -C "$RUNNER_TEMP/offline"
          (cd "$RUNNER_TEMP/offline/alica-community-dsh-1.0.0-linux-amd64" && sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          import json,pathlib,os
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'offline/alica-community-dsh-1.0.0-linux-amd64'
          images=json.load(open(p/'image-map.json'))['images']; sig=p/'evidence/signatures'; cosign=list(sig.glob('*.cosign.json')); upstream=list(sig.glob('*.upstream-digest.json')); assert len(cosign)+len(upstream)==len(images); assert len(list(sig.glob('*.verify.json')))==len(cosign)
          PY
      - name: Independent disconnected application install
        env:
          D6_MODE: offline
          D6_CANDIDATE_DIR: ${{ runner.temp }}/offline/alica-community-dsh-1.0.0-linux-amd64/release
          D6_BUNDLE_ROOT: ${{ runner.temp }}/offline/alica-community-dsh-1.0.0-linux-amd64
        run: chmod +x scripts/d6-*.sh && scripts/d6-independent-operator-acceptance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d6-offline-evidence
          path: acceptance-evidence-d6-offline/

  publish-evidence:
    needs: [bundle, operator-online, operator-offline]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: collected }
      - name: Verify independent results
        env:
          ONLINE: ${{ needs.operator-online.result }}
          OFFLINE: ${{ needs.operator-offline.result }}
          BUNDLE_SHA: ${{ needs.bundle.outputs.asset_sha256 }}
        run: |
          test "$ONLINE" = success && test "$OFFLINE" = success
          python3 - <<'PY'
          import json,pathlib,os
          root=pathlib.Path('collected'); summaries=[]
          for mode in ('online','offline'):
            p=root/f'd6-{mode}-evidence'/'summary.json';x=json.load(open(p));assert x['status']=='PASS' and x['operatorMode']==mode and x['authenticatedQA10Runs']==2 and x['runtimeServices']==10 and x['unresolvedP0']==x['unresolvedP1']==0;summaries.append(x)
          out={'status':'PASS','schemaVersion':'alica-d6-independent-acceptance-result/v1','candidateRevision':os.environ['GITHUB_SHA'],'workflowRun':os.environ['GITHUB_RUN_ID'],'offlineBundleSha256':'sha256:'+os.environ['BUNDLE_SHA'],'independentHosts':2,'onlineOperator':summaries[0],'offlineOperator':summaries[1],'zeroP0P1Blockers':True,'publicationClass':'independent candidate acceptance'}
          p=pathlib.Path('acceptance-evidence-d6');p.mkdir();(p/'summary.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
          cp -a collected/d6-online-evidence/acceptance-evidence-d6-online acceptance-evidence-d6/
          cp -a collected/d6-offline-evidence/acceptance-evidence-d6-offline acceptance-evidence-d6/
      - name: Publish immutable evidence branch
        if: success()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout --orphan d6-evidence-work
          git rm -rf .
          git add -f acceptance-evidence-d6
          git commit -m "evidence: D6 independent acceptance run $GITHUB_RUN_ID"
          git push --force origin HEAD:d6-independent-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d6-combined-evidence
          path: acceptance-evidence-d6/
